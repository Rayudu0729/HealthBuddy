<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="870" viewBox="0 0 1300 870" role="img" aria-labelledby="title desc">
<title id="title">HealthBuddy complete bench wiring</title>
<desc id="desc">Breadboard layout and wiring map for the XIAO, two buttons, buzzer, MPU-6050, VL53L1X, DRV2605L and vibration motor.</desc>
<rect width="1300" height="870" fill="#eef4fa"/>
<g font-family="Arial,sans-serif" fill="#172c44" font-size="17">
<text x="40" y="54" font-size="35" font-weight="bold">HealthBuddy complete bench wiring</text>
<text x="40" y="84" >USB faces left. Match each jumper to the labeled pin and its breadboard strip.</text>
<rect x="40" y="108" width="1220" height="164" rx="14" fill="white" stroke="#a7b6c7"/>
<path d="M62 127H640 M659 127H1238 M62 253H640 M659 253H1238" stroke="#db7788" stroke-width="3"/>
<path d="M62 138H640 M659 138H1238 M62 242H640 M659 242H1238" stroke="#6ba5d0" stroke-width="3"/>
<path d="M62 190H1238" stroke="#d2deeb" stroke-width="9"/>
<rect x="77" y="163" width="144" height="54" rx="8" fill="#dce9fb" stroke="#95a6ba"/><text x="149" y="196" text-anchor="middle" font-weight="bold">XIAO · USB ←</text><rect x="251" y="163" width="93" height="54" rx="8" fill="#dff4eb" stroke="#95a6ba"/><text x="297.5" y="196" text-anchor="middle" font-weight="bold">SOS</text><rect x="371" y="163" width="110" height="54" rx="8" fill="#dff4eb" stroke="#95a6ba"/><text x="426" y="196" text-anchor="middle" font-weight="bold">CANCEL</text><rect x="514" y="163" width="166" height="54" rx="8" fill="#dce9fb" stroke="#95a6ba"/><text x="597" y="196" text-anchor="middle" font-weight="bold">MPU-6050</text><rect x="739" y="163" width="166" height="54" rx="8" fill="#ffe5eb" stroke="#95a6ba"/><text x="822" y="196" text-anchor="middle" font-weight="bold">VL53L1X</text><rect x="1008" y="163" width="188" height="54" rx="8" fill="#dff4eb" stroke="#95a6ba"/><text x="1102" y="196" text-anchor="middle" font-weight="bold">DRV2605L</text>
<text x="42" y="307" font-weight="bold">Signal</text><text x="215" y="307" font-weight="bold">From</text><text x="405" y="307" font-weight="bold">To</text><text x="825" y="307" font-weight="bold">Bench wiring detail</text>
<rect x="40" y="322" width="1220" height="46" rx="6" fill="white"/><rect x="40" y="322" width="6" height="46" rx="3" fill="#b32b45"/><text x="57" y="351" fill="#b32b45" font-weight="bold">3V3</text><text x="215" y="351" >XIAO 3V3</text><text x="405" y="351" >MPU VCC · VL53L1X VCC · DRV VIN</text><text x="825" y="351" font-size="16">DRV E4 · use D4 beside it</text><rect x="40" y="374" width="1220" height="46" rx="6" fill="#f7fbfe"/><rect x="40" y="374" width="6" height="46" rx="3" fill="#45556c"/><text x="57" y="403" fill="#45556c" font-weight="bold">GND</text><text x="215" y="403" >XIAO GND</text><text x="405" y="403" >MPU GND · VL53L1X GND · DRV GND</text><text x="825" y="403" font-size="16">DRV E3 · use D3 beside it</text><rect x="40" y="426" width="1220" height="46" rx="6" fill="white"/><rect x="40" y="426" width="6" height="46" rx="3" fill="#7044ae"/><text x="57" y="455" fill="#7044ae" font-weight="bold">SDA</text><text x="215" y="455" >XIAO D4</text><text x="405" y="455" >MPU SDA · VL53L1X SDA · DRV SDA</text><text x="825" y="455" font-size="16">B42 → C1 (alignment confirmed)</text><rect x="40" y="478" width="1220" height="46" rx="6" fill="#f7fbfe"/><rect x="40" y="478" width="6" height="46" rx="3" fill="#18669e"/><text x="57" y="507" fill="#18669e" font-weight="bold">SCL</text><text x="215" y="507" >XIAO D5</text><text x="405" y="507" >MPU SCL · VL53L1X SCL · DRV SCL</text><text x="825" y="507" font-size="16">B41 → C2 (alignment confirmed)</text><rect x="40" y="530" width="1220" height="46" rx="6" fill="white"/><rect x="40" y="530" width="6" height="46" rx="3" fill="#a14815"/><text x="57" y="559" fill="#a14815" font-weight="bold">BUZZER</text><text x="215" y="559" >XIAO D0</text><text x="405" y="559" >Buzzer S (orange)</text><text x="825" y="559" font-size="16">Buzzer − to GND · yellow middle lead open</text><rect x="40" y="582" width="1220" height="46" rx="6" fill="#f7fbfe"/><rect x="40" y="582" width="6" height="46" rx="3" fill="#147357"/><text x="57" y="611" fill="#147357" font-weight="bold">SOS</text><text x="215" y="611" >XIAO D1</text><text x="405" y="611" >SOS button</text><text x="825" y="611" font-size="16">Other switch contact to GND</text><rect x="40" y="634" width="1220" height="46" rx="6" fill="white"/><rect x="40" y="634" width="6" height="46" rx="3" fill="#08707c"/><text x="57" y="663" fill="#08707c" font-weight="bold">CANCEL</text><text x="215" y="663" >XIAO D2</text><text x="405" y="663" >CANCEL button</text><text x="825" y="663" font-size="16">Other switch contact to GND</text><rect x="40" y="686" width="1220" height="46" rx="6" fill="#f7fbfe"/><rect x="40" y="686" width="6" height="46" rx="3" fill="#864174"/><text x="57" y="715" fill="#864174" font-weight="bold">MOTOR</text><text x="215" y="715" >DRV OUT+ / OUT−</text><text x="405" y="715" >Coin vibration motor</text><text x="825" y="715" font-size="16">One motor lead to each output pad</text>
<text x="42" y="764" font-weight="bold">DRV pin positions as reported: E0 INT (open), E1 SDA, E2 SCL, E3 GND, E4 VIN.</text>
<text x="42" y="794" >Confirm printed pin labels and strip alignment. VL53L1X INT and SHUT are open. Keep both sides of a split rail linked if both are used.</text>
<text x="42" y="824" >Unplug USB while wiring. Before powering up, check 3V3 to GND for shorts and verify both buttons close only when pressed.</text>
</g></svg>
