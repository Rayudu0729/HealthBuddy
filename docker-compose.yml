# Local development stack for the Bindu backend. Usage: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bindu
      POSTGRES_PASSWORD: bindu   # local development only
      POSTGRES_DB: bindu
    ports:
      - "5432:5432"
    volumes:
      - bindu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindu -d bindu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bindu-pgdata:
